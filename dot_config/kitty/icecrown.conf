# ~/.config/kitty/icecrown.conf

font_family      JetBrainsMono Nerd Font
scrollback_lines 20000

linux_display_server wayland

# Auf KDE/Wayland meist angenehm
wayland_titlebar_color background

# Falls du keine CSD/Wayland-Titelbar-Eigenheiten willst, ggf. testen:
# hide_window_decorations no

# Kein macOS-Kram hier
# macos_* Optionen rauslassen

# Tastenkürzel eher Linux/KDE-mäßig
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab

# Splits
map ctrl+shift+d launch --location=hsplit --cwd=current
map ctrl+shift+alt+d launch --location=vsplit --cwd=current

# Config
map ctrl+shift+comma edit_config_file
map ctrl+shift+f5 load_config_file

# Problem mit Farben?
#text_composition_strategy platform
#text_composition_strategy legacy
